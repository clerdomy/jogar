<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#F4F6F9">
<title>Jeux à deux</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1/dist/peerjs.min.js"></script>
<style>
:root{
  --bg:#F4F6F9; --surface:#FFFFFF; --table:#E6EBF2;
  --ink:#16202E; --muted:#667385; --line:#D5DCE6;
  --go:#0C8F63; --go-soft:#DDF3EA;
  --x:#0C8F63; --o:#4250D6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%}
body{font-family:"Outfit",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.4;color:var(--ink);background:var(--bg);height:100dvh;overflow:hidden}
.hidden{display:none!important}
.screen{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px}
.wrap{width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px}

h1{font-size:34px;font-weight:700;line-height:1.1;letter-spacing:-.02em;margin:0}
h2{font-size:15px;font-weight:500;color:var(--muted);margin:14px 0 0}
p{margin:0}
.lead{color:var(--muted);font-size:17px;margin-bottom:6px}
.muted{color:var(--muted)}

button{font:inherit;font-weight:600;font-size:16px;border-radius:12px;padding:13px 18px;border:1px solid transparent;cursor:pointer;transition:transform .08s}
button:active{transform:scale(.98)}
button:disabled{opacity:.45}
button:focus-visible,input:focus-visible{outline:2px solid var(--go);outline-offset:2px}
.primary{background:var(--ink);color:#fff}
.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}

/* accueil */
.choice{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;color:var(--ink)}
.choice .ic{width:52px;display:flex;justify-content:center;align-items:center;gap:6px;flex:none}
.choice b{display:block;font-size:17px;font-weight:600}
.choice span.d{display:block;font-size:14px;font-weight:400;color:var(--muted)}
.join{display:flex;gap:8px}
input{font:inherit;font-size:20px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;text-align:center;flex:1;min-width:0;padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);user-select:text;-webkit-user-select:text}
input::placeholder{color:#A9B3C1;font-weight:500}
#lobbyMsg{min-height:21px;color:var(--muted)}

/* attente */
#codeShow{font-size:40px;font-weight:700;letter-spacing:.2em;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 0 18px .2em;user-select:text;-webkit-user-select:text}
.waitline{display:flex;align-items:center;gap:10px;color:var(--muted);margin-top:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--go);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}

/* écran de jeu */
#game{justify-content:flex-start;padding:12px;gap:10px}
#bar{width:100%;display:flex;justify-content:space-between;align-items:center}
.side{display:flex;align-items:center;gap:8px;padding:7px 13px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:14px;color:var(--muted)}
.side b{font-size:17px;font-weight:600;color:var(--ink)}
.side.on{background:var(--go-soft);border-color:var(--go);color:var(--go)}
.side.on b{color:var(--go)}
.view{flex:1;width:100%;min-height:0;display:flex;flex-direction:column;align-items:center;gap:10px}
.status{min-height:21px;font-weight:500;text-align:center}
.status.wait{color:var(--muted)}

/* dominos */
#oppRow{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px}
#opp{display:flex;flex-wrap:wrap;align-items:center;gap:3px;min-height:22px}
#opp .n{margin-left:6px;font-size:14px;color:var(--muted)}
.back{width:12px;height:22px;border-radius:3px;background:var(--surface);border:1px solid #C3CCD8}
.chip{flex:none;font-size:14px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px 12px}
#board{flex:1;width:100%;overflow-y:auto;display:flex;flex-wrap:wrap;align-items:center;align-content:center;justify-content:center;gap:4px;padding:10px;background:var(--table);border-radius:18px}
#actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
#actions button{padding:10px 16px;font-size:15px}
#hand{width:100%;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:10px 2px 4px;max-height:42dvh;overflow-y:auto}

.tile{--s:42px;display:inline-flex;flex:none;background:#fff;border:1px solid #C3CCD8;border-radius:calc(var(--s)*.2);box-shadow:0 1px 2px rgba(22,32,46,.14);transition:transform .12s,opacity .12s,box-shadow .12s}
.tile.v{flex-direction:column}
.tile.sm{--s:22px}
.half{width:var(--s);height:var(--s);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:calc(var(--s)*.15)}
.tile.v .half+.half{border-top:1.5px solid #B8C2CF}
.tile.h .half+.half{border-left:1.5px solid #B8C2CF}
.half i{border-radius:50%;margin:10%}
.half i.p{background:var(--ink)}
#board .tile.end{box-shadow:0 0 0 2px var(--go)}
#hand.turn .tile:not(.ok){opacity:.35}
#hand .tile.ok{transform:translateY(-6px);box-shadow:0 4px 10px rgba(22,32,46,.16)}
#hand .tile.sel{transform:translateY(-12px);box-shadow:0 0 0 2px var(--go),0 6px 14px rgba(22,32,46,.18)}

/* morpion */
#ttt{justify-content:center;gap:20px}
#grid{width:min(88vw,340px);aspect-ratio:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:8px}
.cell{position:relative;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;transition:transform .12s,background .15s}
.cell.x::before,.cell.x::after{content:"";position:absolute;width:54%;height:9%;border-radius:99px;background:var(--x)}
.cell.x::before{transform:rotate(45deg)}
.cell.x::after{transform:rotate(-45deg)}
.cell.o::before{content:"";width:48%;height:48%;border-radius:50%;border:8px solid var(--o)}
.cell.sel{transform:scale(1.06);box-shadow:0 0 0 2px var(--ink)}
.cell.target{background:var(--go-soft);border:1px dashed var(--go)}
.cell.win{background:var(--ink);border-color:var(--ink)}
.cell.win.x::before,.cell.win.x::after{background:#fff}
.cell.win.o::before{border-color:#fff}

/* petits symboles X / O */
.mk{display:inline-block;position:relative;width:14px;height:14px;flex:none}
.mk:not(.x):not(.o){display:none}
.mk.lg{width:20px;height:20px}
.mk.x::before,.mk.x::after{content:"";position:absolute;left:0;top:50%;width:100%;height:3px;margin-top:-1.5px;border-radius:9px;background:var(--x)}
.mk.x::before{transform:rotate(45deg)}
.mk.x::after{transform:rotate(-45deg)}
.mk.o{border:3px solid var(--o);border-radius:50%}

/* résultat */
#overlay{position:fixed;inset:0;background:rgba(22,32,46,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--surface);width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:24px 20px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.sheet h3{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}
.sheet p{color:var(--muted)}
#ovTiles{display:flex;flex-wrap:wrap;gap:4px}
#ovTiles:empty{display:none}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="lobby" class="screen">
  <div class="wrap">
    <h1>Jeux à deux</h1>
    <p class="lead">Deux téléphones, une partie.</p>

    <h2>Créer une salle</h2>
    <button id="btnDom" class="choice">
      <span class="ic" id="icDom"></span>
      <span><b>Dominos</b><span class="d">28 dominos, 7 chacun, une pioche</span></span>
    </button>
    <button id="btnTtt" class="choice">
      <span class="ic"><span class="mk lg x"></span><span class="mk lg o"></span></span>
      <span><b>Morpion</b><span class="d">3 pions chacun, puis on les déplace</span></span>
    </button>

    <h2>Rejoindre une salle</h2>
    <div class="join">
      <input id="codeInput" maxlength="5" placeholder="CODE" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Code de la salle">
      <button id="btnJoin" class="primary">Rejoindre</button>
    </div>
    <p id="lobbyMsg"></p>
  </div>
</div>

<div id="waiting" class="screen hidden">
  <div class="wrap">
    <h1>Votre salle</h1>
    <p class="lead">Envoyez ce code à votre ami.</p>
    <div id="codeShow"></div>
    <button id="btnShare" class="primary">Partager le code</button>
    <div class="waitline"><span class="dot"></span><span>En attente de l'autre joueur. Gardez cet écran ouvert.</span></div>
  </div>
</div>

<div id="game" class="screen hidden">
  <div id="bar">
    <div class="side" id="sMe"><span class="mk" id="mkMe"></span><span>Vous</span><b id="scMe">0</b></div>
    <div class="side" id="sOp"><b id="scOp">0</b><span>Adversaire</span><span class="mk" id="mkOp"></span></div>
  </div>

  <div id="dom" class="view">
    <div id="oppRow">
      <div id="opp"></div>
      <div class="chip" id="stock"></div>
    </div>
    <div id="board"></div>
    <div id="status" class="status"></div>
    <div id="actions">
      <button id="btnL" class="ghost hidden"></button>
      <button id="btnR" class="ghost hidden"></button>
      <button id="btnDraw" class="primary hidden">Piocher</button>
    </div>
    <div id="hand"></div>
  </div>

  <div id="ttt" class="view hidden">
    <div id="grid"></div>
    <div id="tStatus" class="status"></div>
  </div>
</div>

<div id="overlay" class="hidden">
  <div class="sheet">
    <h3 id="ovTitle"></h3>
    <p id="ovText"></p>
    <div id="ovTiles"></div>
    <button id="ovBtn" class="primary"></button>
    <button id="ovBtn2" class="ghost"></button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const PREFIX = 'jeux-salle-';
const ABC = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';

let peer = null, conn = null, isHost = false;
let G = null;          // état complet (uniquement chez le créateur de la salle)
let V = null;          // ce que ce joueur voit
let wins = [0, 0];
let selected = -1;
let dead = false;
let firstGame = 'domino';
let tttStarter = 0;

/* ---------- écrans ---------- */
function show(id){ ['lobby','waiting','game'].forEach(s => $(s).classList.toggle('hidden', s !== id)); }
function lobbyMsg(t){ $('lobbyMsg').textContent = t; }
function setBusy(b){ ['btnDom','btnTtt','btnJoin'].forEach(id => $(id).disabled = b); }
function overlay(title, text, tiles, btn, fn, btn2, fn2){
  $('ovTitle').textContent = title;
  $('ovText').textContent = text;
  const box = $('ovTiles'); box.innerHTML = '';
  (tiles || []).forEach(t => box.appendChild(tileEl(t, false, 'sm')));
  $('ovBtn').textContent = btn; $('ovBtn').onclick = fn;
  $('ovBtn2').classList.toggle('hidden', !btn2);
  if (btn2){ $('ovBtn2').textContent = btn2; $('ovBtn2').onclick = fn2; }
  $('overlay').classList.remove('hidden');
}

/* =====================================================
   LOGIQUE (tourne seulement chez le créateur de la salle)
   ===================================================== */
function start(game){ if (game === 'ttt') newTtt(); else newDomino(); }

function act(p, a){
  if (!G) return;
  if (G.over){
    if (a.t === 'again') start(G.game);
    else if (a.t === 'switch') start(G.game === 'ttt' ? 'domino' : 'ttt');
    return;
  }
  if (p !== G.turn) return;
  if (G.game === 'ttt') actTtt(p, a); else actDomino(p, a);
}

/* ---------- dominos ---------- */
function fits(t, board){
  if (!board.length) return { l:true, r:true };
  const L = board[0][0], R = board[board.length-1][1];
  return { l: t[0]===L || t[1]===L, r: t[0]===R || t[1]===R };
}
function canPlay(hand, board){ return hand.some(t => { const f = fits(t, board); return f.l || f.r; }); }
function pips(hand){ return hand.reduce((s,t) => s + t[0] + t[1], 0); }

function newDomino(){
  const tiles = [];
  for (let a=0; a<=6; a++) for (let b=a; b<=6; b++) tiles.push([a,b]);
  for (let i=tiles.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [tiles[i], tiles[j]] = [tiles[j], tiles[i]];
  }
  G = { game:'domino', board:[], hands:[tiles.slice(0,7), tiles.slice(7,14)], stock:tiles.slice(14), turn:0, over:null, passed:null };
  let best = -1;                                   // le plus gros double commence
  G.hands.forEach((h,p) => h.forEach(t => { if (t[0]===t[1] && t[0]>best){ best = t[0]; G.turn = p; } }));
  sync();
}

function finish(winner, reason){
  G.over = { winner, reason };
  if (winner >= 0) wins[winner]++;
}

function settle(){
  const p = G.turn;
  if (canPlay(G.hands[p], G.board) || G.stock.length) return;
  if (!canPlay(G.hands[1-p], G.board)){            // personne ne peut jouer : jeu bloqué
    const a = pips(G.hands[0]), b = pips(G.hands[1]);
    finish(a===b ? -1 : (a<b ? 0 : 1), 'bloque');
    return;
  }
  G.passed = p; G.turn = 1-p;
}

function actDomino(p, a){
  const hand = G.hands[p];
  if (a.t === 'play'){
    const t = hand[a.i];
    if (!t) return;
    const f = fits(t, G.board);
    if (!G.board.length){
      G.board.push(t);
    } else if (a.side === 'l' && f.l){
      const L = G.board[0][0];
      G.board.unshift(t[1]===L ? t : [t[1], t[0]]);
    } else if (a.side === 'r' && f.r){
      const R = G.board[G.board.length-1][1];
      G.board.push(t[0]===R ? t : [t[1], t[0]]);
    } else return;
    hand.splice(a.i, 1);
    G.passed = null;
    if (!hand.length){ finish(p, 'fini'); sync(); return; }
    G.turn = 1-p;
  } else if (a.t === 'draw'){
    if (canPlay(hand, G.board) || !G.stock.length) return;
    hand.push(G.stock.pop());
    G.passed = null;
  } else return;
  settle();
  sync();
}

/* ---------- morpion à 3 pions ---------- */
const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

function newTtt(){
  G = { game:'ttt', cells:Array(9).fill(null), turn:tttStarter, over:null };
  tttStarter = 1 - tttStarter;                     // on alterne celui qui commence
  sync();
}

function actTtt(p, a){
  const c = G.cells, n = c.filter(x => x === p).length;
  if (a.t === 'place'){
    if (n >= 3 || c[a.c] !== null) return;
    c[a.c] = p;
  } else if (a.t === 'move'){
    if (n < 3 || c[a.from] !== p || c[a.to] !== null) return;
    c[a.from] = null; c[a.to] = p;
  } else return;
  const line = LINES.find(l => l.every(i => c[i] === p));
  if (line){ G.over = { winner:p, reason:'ligne', line }; wins[p]++; }
  else G.turn = 1-p;
  sync();
}

/* ---------- vue envoyée à chaque joueur ---------- */
function view(p){
  const o = 1-p;
  const base = { game:G.game, me:p, myTurn: !G.over && G.turn === p, score:[wins[p], wins[o]] };
  const res = G.over ? (G.over.winner < 0 ? 'draw' : (G.over.winner === p ? 'win' : 'lose')) : null;
  if (G.game === 'ttt'){
    return Object.assign(base, { cells:G.cells, over: G.over ? { res, line:G.over.line } : null });
  }
  return Object.assign(base, {
    hand:G.hands[p], opp:G.hands[o].length, board:G.board, stock:G.stock.length,
    passed: G.passed == null ? null : (G.passed === p ? 'me' : 'opp'),
    over: G.over ? { res, reason:G.over.reason, oppHand:G.hands[o], myPips:pips(G.hands[p]), oppPips:pips(G.hands[o]) } : null
  });
}

function sync(){
  V = view(0); selected = -1; render();
  if (conn && conn.open) conn.send({ t:'state', v:view(1) });
}

function send(a){
  if (isHost) act(0, a);
  else if (conn && conn.open) conn.send(a);
}

/* =====================================================
   AFFICHAGE
   ===================================================== */
const PIPS = {0:[],1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
function halfEl(n, horiz){
  const h = document.createElement('div'); h.className = 'half';
  const on = (n===6 && horiz) ? [0,1,2,6,7,8] : PIPS[n];
  for (let i=0; i<9; i++){
    const d = document.createElement('i');
    if (on.includes(i)) d.className = 'p';
    h.appendChild(d);
  }
  return h;
}
function tileEl(t, horiz, cls){
  const e = document.createElement('div');
  e.className = 'tile ' + (horiz ? 'h' : 'v') + (cls ? ' '+cls : '');
  e.append(halfEl(t[0], horiz), halfEl(t[1], horiz));
  return e;
}
$('icDom').appendChild(tileEl([5,3], true, 'sm'));   // icône de l'accueil

function setStatus(id, text){
  const el = $(id);
  el.textContent = text;
  el.classList.toggle('wait', !V.myTurn);
}

function updateBar(){
  const isTtt = V.game === 'ttt';
  $('scMe').textContent = V.score[0];
  $('scOp').textContent = V.score[1];
  $('sMe').classList.toggle('on', V.myTurn);
  $('sOp').classList.toggle('on', !V.myTurn && !V.over);
  $('mkMe').className = 'mk' + (isTtt ? (V.me === 0 ? ' x' : ' o') : '');
  $('mkOp').className = 'mk' + (isTtt ? (V.me === 0 ? ' o' : ' x') : '');
}

function render(){
  if (!V || dead) return;
  show('game');
  const isTtt = V.game === 'ttt';
  $('dom').classList.toggle('hidden', isTtt);
  $('ttt').classList.toggle('hidden', !isTtt);
  updateBar();
  if (isTtt) renderTtt(); else renderDomino();

  if (V.over){
    const go = () => { if (V && V.over && !dead) showResult(); };
    if (isTtt) setTimeout(go, 600); else go();     // au morpion, on laisse voir la ligne gagnante
  } else {
    $('overlay').classList.add('hidden');
  }
}

function showResult(){
  const o = V.over, isTtt = V.game === 'ttt';
  const title = o.res === 'win' ? 'Vous avez gagné' : o.res === 'lose' ? 'Vous avez perdu' : 'Égalité';
  let text, tiles = null;
  if (isTtt){
    text = o.res === 'win' ? 'Trois pions alignés.' : "L'adversaire a aligné trois pions.";
  } else if (o.reason === 'fini'){
    text = o.res === 'win' ? "Vous avez posé tous vos dominos. Il restait à l'adversaire :" : "L'adversaire a posé tous ses dominos.";
    tiles = o.res === 'win' ? o.oppHand : null;
  } else {
    text = `Jeu bloqué. Vous avez ${o.myPips} points, l'adversaire ${o.oppPips}. Le plus petit total gagne. Dominos de l'adversaire :`;
    tiles = o.oppHand;
  }
  overlay(title, text, tiles,
    'Rejouer', () => send({ t:'again' }),
    isTtt ? 'Jouer aux dominos' : 'Jouer au morpion', () => send({ t:'switch' }));
}

/* ---------- dominos ---------- */
function renderDomino(){
  const opp = $('opp'); opp.innerHTML = '';
  for (let i=0; i<V.opp; i++){ const b = document.createElement('div'); b.className = 'back'; opp.appendChild(b); }
  const n = document.createElement('span'); n.className = 'n'; n.textContent = V.opp; opp.appendChild(n);
  $('stock').textContent = 'Pioche ' + V.stock;

  const board = $('board'); board.innerHTML = '';
  V.board.forEach((t,i) => {
    const el = tileEl(t, t[0]!==t[1], 'sm');
    if (V.board.length > 1 && (i===0 || i===V.board.length-1)) el.classList.add('end');
    board.appendChild(el);
  });

  const playable = canPlay(V.hand, V.board);
  const hand = $('hand'); hand.innerHTML = '';
  hand.classList.toggle('turn', V.myTurn);
  V.hand.forEach((t,i) => {
    const el = tileEl(t, false);
    const f = fits(t, V.board);
    if (V.myTurn && (f.l || f.r)){ el.classList.add('ok'); el.onclick = () => tapTile(i); }
    if (i === selected) el.classList.add('sel');
    hand.appendChild(el);
  });

  let s = V.passed === 'me' ? 'Vous avez passé votre tour. ' : V.passed === 'opp' ? "L'adversaire a passé son tour. " : '';
  if (V.over) s = 'Partie terminée';
  else if (!V.myTurn) s += "Tour de l'adversaire";
  else if (selected >= 0) s = 'De quel côté ?';
  else if (playable) s += 'À vous : touchez un domino';
  else s += 'Aucun coup possible, piochez';
  setStatus('status', s);

  const pick = V.myTurn && selected >= 0 && V.board.length;
  $('btnL').classList.toggle('hidden', !pick);
  $('btnR').classList.toggle('hidden', !pick);
  if (pick){
    $('btnL').textContent = 'Côté gauche (' + V.board[0][0] + ')';
    $('btnR').textContent = 'Côté droit (' + V.board[V.board.length-1][1] + ')';
  }
  $('btnDraw').classList.toggle('hidden', !(V.myTurn && !playable && V.stock > 0));
}

function tapTile(i){
  if (!V || !V.myTurn) return;
  if (!V.board.length){ send({ t:'play', i, side:'r' }); return; }
  const f = fits(V.hand[i], V.board);
  const L = V.board[0][0], R = V.board[V.board.length-1][1];
  if (f.l && f.r && L !== R){ selected = (selected === i ? -1 : i); render(); return; }
  send({ t:'play', i, side: f.l ? 'l' : 'r' });
}
$('btnL').onclick = () => { if (selected >= 0) send({ t:'play', i:selected, side:'l' }); };
$('btnR').onclick = () => { if (selected >= 0) send({ t:'play', i:selected, side:'r' }); };
$('btnDraw').onclick = () => send({ t:'draw' });

/* ---------- morpion ---------- */
function renderTtt(){
  const mine = V.cells.filter(x => x === V.me).length;
  const grid = $('grid'); grid.innerHTML = '';
  V.cells.forEach((c,i) => {
    const el = document.createElement('div');
    el.className = 'cell';
    if (c !== null) el.classList.add(c === 0 ? 'x' : 'o');
    if (i === selected) el.classList.add('sel');
    if (c === null && selected >= 0) el.classList.add('target');
    if (V.over && V.over.line && V.over.line.includes(i)) el.classList.add('win');
    el.onclick = () => tapCell(i);
    grid.appendChild(el);
  });

  let s;
  if (V.over) s = 'Partie terminée';
  else if (!V.myTurn) s = "Tour de l'adversaire";
  else if (mine < 3) s = `À vous : posez un pion (${mine}/3)`;
  else if (selected < 0) s = 'À vous : choisissez un pion à déplacer';
  else s = "Choisissez la case d'arrivée";
  setStatus('tStatus', s);
}

function tapCell(i){
  if (!V || !V.myTurn) return;
  const c = V.cells, mine = c.filter(x => x === V.me).length;
  if (mine < 3){ if (c[i] === null) send({ t:'place', c:i }); return; }
  if (c[i] === V.me){ selected = (selected === i ? -1 : i); render(); }
  else if (c[i] === null && selected >= 0) send({ t:'move', from:selected, to:i });
}

/* =====================================================
   CONNEXION ENTRE LES DEUX TÉLÉPHONES
   ===================================================== */
function mkCode(){ let s=''; for (let i=0;i<5;i++) s += ABC[Math.floor(Math.random()*ABC.length)]; return s; }

function lost(){
  if (dead) return;
  dead = true;
  overlay('Connexion perdue', "L'autre joueur est parti ou la connexion a été coupée.", null, "Retour à l'accueil", () => location.reload());
}
function netError(e){
  if (V) return;                                   // déjà en jeu : la connexion directe reste active
  lobbyMsg('Erreur de connexion (' + (e.type || 'inconnue') + '). Réessayez.');
  setBusy(false); show('lobby');
}
function checkLib(){
  if (typeof Peer === 'undefined'){ lobbyMsg("Pas d'internet : impossible de charger la connexion."); return false; }
  return true;
}

function createRoom(game){
  if (!checkLib()) return;
  isHost = true; firstGame = game; setBusy(true); lobbyMsg('Création de la salle…');
  const code = mkCode();
  peer = new Peer(PREFIX + code);
  peer.on('open', () => { $('codeShow').textContent = code; show('waiting'); });
  peer.on('connection', c => {
    if (conn && conn.open){ c.on('open', () => c.close()); return; }   // salle pleine
    conn = c;
    c.on('open', () => { wins = [0,0]; start(firstGame); });
    c.on('data', d => {
      if (!d || typeof d !== 'object') return;
      if (d.t === 'hello'){ if (G) sync(); return; }
      act(1, d);
    });
    c.on('close', lost);
  });
  peer.on('disconnected', () => { if (!peer.destroyed) peer.reconnect(); });
  peer.on('error', e => {
    if (e.type === 'unavailable-id'){ peer.destroy(); createRoom(game); }   // code déjà pris : on en génère un autre
    else netError(e);
  });
}

function joinRoom(raw){
  if (!checkLib()) return;
  const code = (raw || '').trim().toUpperCase();
  if (code.length !== 5){ lobbyMsg('Entrez le code à 5 caractères.'); return; }
  isHost = false; setBusy(true); lobbyMsg('Connexion…');
  peer = new Peer();
  peer.on('open', () => {
    conn = peer.connect(PREFIX + code, { reliable:true });
    conn.on('open', () => { lobbyMsg('Connecté, la partie démarre…'); conn.send({ t:'hello' }); });
    conn.on('data', d => { if (d && d.t === 'state'){ V = d.v; selected = -1; render(); } });
    conn.on('close', lost);
  });
  peer.on('error', e => {
    if (e.type === 'peer-unavailable'){
      lobbyMsg('Salle introuvable. Vérifiez le code.');
      setBusy(false); peer.destroy();
    } else netError(e);
  });
}

$('btnDom').onclick = () => createRoom('domino');
$('btnTtt').onclick = () => createRoom('ttt');
$('btnJoin').onclick = () => joinRoom($('codeInput').value);
$('codeInput').addEventListener('keydown', e => { if (e.key === 'Enter') joinRoom($('codeInput').value); });

$('btnShare').onclick = () => {
  const code = $('codeShow').textContent;
  const web = location.protocol.startsWith('http');
  const url = web ? location.origin + location.pathname + '?salle=' + code : '';
  const text = 'Viens jouer avec moi ! Code de la salle : ' + code + (url ? '\n' + url : '');
  if (navigator.share) navigator.share({ text }).catch(() => {});
  else if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => { $('btnShare').textContent = 'Code copié'; });
};

// un lien avec ?salle=CODE rejoint directement la salle
const q = new URLSearchParams(location.search).get('salle');
if (q){ $('codeInput').value = q.toUpperCase(); joinRoom(q); }
